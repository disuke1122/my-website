<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ファルカ杯ビルド比較チェッカー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 0.4;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-teal-500/30 selection:text-teal-200">
  <!-- ヘッダー -->
  <header class="border-b border-slate-800/90 bg-slate-900/75 backdrop-blur sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400"></span>
          <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white">ファルカ杯ビルド比較チェッカー</h1>
        </div>
        <p class="text-xs text-slate-400 mt-0.5">
          現在装備中の全体ステータスから杯を差し引いた基準ATKをもとに、炎杯と攻撃力%杯の期待値・逆転目安をリアルタイム比較
        </p>
      </div>
      <div class="flex items-center gap-2.5 self-end sm:self-auto">
        <div id="activeBuffSummary" class="px-3 py-1.5 rounded-lg bg-slate-800/90 border border-slate-700 text-xs font-mono text-slate-200">
          合計バフ: 読み込み中...
        </div>
        <button
          id="resetSampleBtn"
          type="button"
          class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs font-semibold text-slate-200 transition cursor-pointer"
        >
          サンプル初期化
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <!-- 左カラム（入力・設定） -->
    <section class="lg:col-span-5 space-y-6">
      <!-- 1. 凸数とパーティーバフ -->
      <div class="rounded-2xl bg-slate-900/80 border border-slate-800 p-5 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-white flex items-center gap-2">
            <span class="w-5 h-5 rounded-full bg-teal-500/20 text-teal-300 text-xs flex items-center justify-center font-mono">1</span>
            凸数とパーティーバフ設定
          </h2>
          <span class="text-[11px] text-slate-400">リアルタイム反映</span>
        </div>

        <div class="space-y-1.5">
          <div class="text-xs text-slate-300 font-medium">ファルカ 凸数（炎 / 風ダメージ割合）</div>
          <div class="grid grid-cols-3 gap-2" id="constellationGroup">
            <button type="button" data-const="C0" class="const-btn rounded-xl border p-2.5 text-left transition cursor-pointer">
              <div class="text-xs font-bold">無凸</div>
              <div class="text-[11px] text-slate-400 font-mono mt-0.5">炎75.9% / 風24.1%</div>
            </button>
            <button type="button" data-const="C1" class="const-btn rounded-xl border p-2.5 text-left transition cursor-pointer">
              <div class="text-xs font-bold">1凸</div>
              <div class="text-[11px] text-slate-400 font-mono mt-0.5">炎73.4% / 風26.6%</div>
            </button>
            <button type="button" data-const="C2" class="const-btn rounded-xl border p-2.5 text-left transition cursor-pointer">
              <div class="text-xs font-bold">2凸</div>
              <div class="text-[11px] text-slate-400 font-mono mt-0.5">炎64.4% / 風35.6%</div>
            </button>
          </div>
        </div>

        <div class="space-y-2">
          <div class="text-xs text-slate-300 font-medium">切り替え可能なパーティーバフ</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <label class="flex items-center justify-between rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2.5 cursor-pointer hover:border-slate-700 transition">
              <span class="text-xs text-slate-200">
                プルーネ完凸 <span class="text-[11px] font-mono text-teal-300 ml-1">攻撃+350</span>
              </span>
              <input id="buffPruneC6" type="checkbox" class="rounded accent-teal-400 w-4 h-4" />
            </label>

              <span class="text-xs text-slate-200">
                ニコ2凸 <span class="text-[11px] font-mono text-teal-300 ml-1">攻撃+300</span>
              </span>
